<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <script defer src="Stopwatch.js"></script>
    <link rel="stylesheet" href="Stopwatch.css">
</head>

<body>
    <h1 class="title">STOPWATCH</h1>
    <div class="subtitle">WITH JAVASCRIPT</div>
    <div class="container">
        <div class="container2">
            <div id="hr">00</div>
            <div>:</div>
            <div id="min">00</div>
            <div>:</div>
            <div id="sec">00</div>
            <div>:</div>
            <div id="count">00</div>
        </div>
        <input type="button" value="Start" id="b1" onclick="start()">
        <input type="button" value="Stop" id="b2" onclick="stop()">
        <input type="button" value="Reset" id="b3" onclick="reset()">
    </div>
</body>

</html>
