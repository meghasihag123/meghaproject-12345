<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="Password-Generator.css">
</head>

<body>
    <div class="container">
        <span> Password Generator</span>
        <input type="text">
        <p id="len">Password Length</p>
        <p id="s">Password Settings</p>
        <form action="#">
            <label>
                <input type="checkbox" id="uppercase" checked>Uppercase (A-Z)
            </label>
            <label>
                <input type="checkbox" id="lowercase" checked>Lowercase (a-z)
            </label>
            <label>
                <input type="checkbox" id="numbers">Numbers (0-9)
            </label>
            <label>
                <input type="checkbox" id="symbols">Symbols (!-*)
            </label>
        </form>
    </div>

    <script src="Password-Generator.js"></script>
</body>

</html>
