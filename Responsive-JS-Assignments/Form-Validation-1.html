<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <script defer src="Form-Validation-1.js"></script>
    <link rel="stylesheet" href="Form-Validation-1.css">
</head>

<body>
    <div class="form-container">
        <form action="Form-message.html" onsubmit="return data()">
            <label for="n1">User_name</label>
            <input type="text" id="n1" name="username" placeholder="username"><br><br>

            <label for="n2">Contact_no </label>
            <input type="number" id="n2" name="contact" placeholder="+91"><br><br>

            <label for="n3"> Password_ </label>
            <input type="password" id="n3" name="password" placeholder="password"><br><br>

            <label for="n4">Confirm<br>Password_ </label>
            <input type="password" id="n4" name="confirm_password" placeholder="Confirm_password"><br><br>

            <input type="submit" value="Submit Form" id="n5">
        </form>
    </div>
</body>

</html>
