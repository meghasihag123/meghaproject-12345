<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form-assignment</title>
</head>

<body leftmargin="200px">
    <center>
        <font size="4"><b>APPLICATION FORM</b></font>
    </center>
    <br>
    <form action="">

        <fieldset>
            <legend>Personal Details</legend>
            <table width="100%" cellpadding="10px">
                <tr>
                    <td><label for="">Applicant's <br>full name</label></td>
                    <td>
                        <select name="" id="">
                            <option value="">--Select--</option>
                            <option value="">Mr.</option>
                            <option value="">Ms.</option>
                            <option value="">Others</option>
                            <br>
                            <input type="text">
                        </select>
                    </td>
                    <td><label for=""> Care Of</label> </td>
                    <td>
                        <label for="">Parents</label>
                        <input type="radio" name="type">

                        <label for="">Guardian</label>
                        <input type="radio" name="type">
                    </td>
                </tr>
                <tr>
                    <td><label for="">Father's<br> Name </label></td>
                    <td>
                        <select name="" id="" disabled>
                            <option value="">Mr.</option>
                            <input type="text">
                        </select>
                    </td>
                    <td>Mother's<br>Name</td>
                    <td>
                        <select name="" id="" disabled>
                            <option value="">Mrs.</option>
                            <input type="text" name="" id="">
                        </select>
                    </td>
                </tr>


                <tr>
                    <td><label for="">Gender </label></td>
                    <td>
                        <label for="m">Male</label>
                        <input type="radio" id="m" name="Gender">
                        <label for="f">Female</label>
                        <input type="radio" id="f" name="Gender"><br>
                        <label for="o">Others</label>
                        <input type="radio" id="o" name="Gender">
                    </td>
                    <td><label for="">Date of<br> Birth</label></td>
                    <td>
                        <input type="date">
                    </td>
                </tr>

                <tr>
                    <td><label for="">Marital<br> Status </label></td>
                    <td>
                        <select name="" id="">
                            <option value="">Single</option>
                            <option value="">Married</option>
                            <option value="">Divorced</option>
                            <option value="">Widowed</option>
                        </select>
                    </td>
                    <td><label for="">Category </label></td>
                    <td>
                        <select name="" id="">
                            <option value="">General</option>
                            <option value="">OBC</option>
                            <option value="">SC</option>
                            <option value="">ST</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="">Handicapped </label></td>
                    <td>
                        <label for="t1">No</label>
                        <input type="radio" id="t1" name="Handicapped">
                        <label for="t2">Yes</label>
                        <input type="radio" id="t2" name="Handicapped">
                    </td>
                    <td><label for="">Ex-<br>Serviceman </label></td>
                    <td>
                        <label for="t3">No</label>
                        <input type="radio" id="t3" name="Ex-serviceman">
                        <label for="t4">Yes</label>
                        <input type="radio" id="t4" name="Ex-serviceman">
                    </td>
                </tr>

                <tr>
                    <td><label for="">EWS </label></td>
                    <td>
                        <label for="t5">No</label>
                        <input type="radio" id="t5" name="EWS">
                        <label for="t6">Yes</label>
                        <input type="radio" id="t6" name="EWS">
                    </td>
                    <td><label for="">Religion </label></td>
                    <td>
                        <select name="" id="">
                            <option value="">--Select--</option>
                            <option value="">Hindu</option>
                            <option value="">Muslim</option>
                            <option value="">Jain</option>
                            <option value="">Christianity</option>
                        </select>
                    </td>
                </tr>




            </table>
        </fieldset>
        <fieldset>
            <legend>Contact Details</legend>
            <table width="100%" cellpadding="10px">
                <tr>
                    <td><label for="">Mobile <br>Number </label></td>
                    <td>
                        <input type="text">
                    </td>
                    <td><label for="">Email<br> ID</label></td>
                    <td>
                        <input type="text">
                    </td>
                </tr>

                <tr>
                    <td><label for="">Address<br> Line 1 </label></td>
                    <td>
                        <input type="text">
                    </td>
                    <td><label for="">Address<br> Line 2</label></td>
                    <td>
                        <input type="text">
                    </td>
                </tr>

                <tr>
                    <td><label for="">City </label></td>
                    <td>
                        <input type="text">
                    </td>
                    <td><label for="">State</label></td>
                    <td>
                        <select name="" id="">
                            <option value="">--Select--</option>
                            <option value="">Haryana</option>
                            <option value="">UP</option>
                            <option value="">Punjab</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="">Pin<br>Code </label></td>
                    <td>
                        <input type="text">
                    </td>
                </tr>
            </table>
        </fieldset>

        <fieldset>
            <legend>Qualification Details</legend>
            <table width="100%" cellpadding="10px">
                <td><label for="">
                        <font size="3"><b>Sr<br> No.</b></font>
                    </label></td>
                <td><label for="">
                        <font size="3"><b>Qualification </b></font>
                    </label></td>
                <td><label for="">
                        <font size="3"><b>Board/University </b></font>
                    </label></td>
                <td><label for="">
                        <font size="3"><b>Passing<br> Year </b></font>
                    </label></td>
                <td><label for="">
                        <font size="3"><b>Max Marks </b></font>
                    </label></td>
                <td><label for="">
                        <font size="3"><b>Marks<br> Obtain </b></font>
                    </label></td>
                <td><label for="">
                        <font size="3"><b>Percentage </b></font>
                    </label></td>

                <tr>
                    <td><label for="">1.</label></td>
                    <td><label for="">
                            <select name="" id="">
                                <option value="">--Select--</option>
                                <option value="">10th</option>
                                <option value="">12th</option>
                                <option value="">Graduate</option>
                                <option value="">Post Graduate</option>
                            </select>
                        </label></td>
                    <td><input type="text" /></td>
                    <td><input type="number" min="0" max="10000"></td>
                    <td><input type="number" min="0" max="10000"></td>
                    <td><input type="number" min="0" max="10000"></td>
                    <td><input type="number" min="0" max="100"></td>
                </tr>

                <tr>
                    <td><label for="">2.</label></td>
                    <td><label for="">
                            <select name="" id="">
                                <option value="">--Select--</option>
                                <option value="">10th</option>
                                <option value="">12th</option>
                                <option value="">Graduate</option>
                                <option value="">Post Graduate</option>
                            </select>
                        </label></td>
                    <td><input type="text" /></td>
                    <td><input type="number" min="0" max="10000"></td>
                    <td><input type="number" min="0" max="10000"></td>
                    <td><input type="number" min="0" max="10000"></td>
                    <td><input type="number" min="0" max="100"></td>
                </tr>
                <tr>
                    <td><label for="">3.</label></td>
                    <td><label for="">
                            <select name="" id="">
                                <option value="">--Select--</option>
                                <option value="">10th</option>
                                <option value="">12th</option>
                                <option value="">Graduate</option>
                                <option value="">Post Graduate</option>
                            </select>
                        </label></td>
                    <td><input type="text" /></td>
                    <td><input type="number" min="0" max="10000"></td>
                    <td><input type="number" min="0" max="10000"></td>
                    <td><input type="number" min="0" max="10000"></td>
                    <td><input type="number" min="0" max="100"></td>
                </tr>
                <tr>
                    <td><label for="">4.</label></td>
                    <td><label for="">
                            <select name="" id="">
                                <option value="">--Select--</option>
                                <option value="">10th</option>
                                <option value="">12th</option>
                                <option value="">Graduate</option>
                                <option value="">Post Graduate</option>
                            </select>
                        </label></td>
                    <td><input type="text" /></td>
                    <td><input type="number" min="0" max="10000"></td>
                    <td><input type="number" min="0" max="10000"></td>
                    <td><input type="number" min="0" max="10000"></td>
                    <td><input type="number" min="0" max="100"></td>
                </tr>

            </table>
        </fieldset>

        <fieldset>
            <legend>Language Knowledge </legend>
            <table width="100%" cellpadding="5px">
                <tr>
                    <td><label for="">Language </label></td>
                    <td><label for="">Reading </label></td>
                    <td><label for="">Writing </label></td>
                    <td><label for="">Spoken </label></td>

                </tr>
                <tr>
                    <td><label for="">Hindi</label></td>
                    <td>
                        <input type="checkbox">
                    </td>
                    <td> <input type="checkbox"></td>
                    <td> <input type="checkbox"></td>
                </tr>
                <tr>
                    <td><label for="">English</label></td>
                    <td>
                        <input type="checkbox">
                    </td>
                    <td> <input type="checkbox"></td>
                    <td> <input type="checkbox"></td>
                </tr>
                <tr>
                    <td><label for="">Urdu</label></td>
                    <td>
                        <input type="checkbox">
                    </td>
                    <td> <input type="checkbox"></td>
                    <td> <input type="checkbox"></td>
                </tr>
            </table>
        </fieldset>

        <fieldset>
            <legend>Identification Details</legend>
            <table>
                <tr>
                    <td><label for="">Aadhar<br> Card<br> Number
                        </label></td>
                    <td><input type="text"></td>
                    <td><label for=""> PAN<br> Card<br> Number</label></td>
                    <td><input type="text"></td>
                </tr>

                <tr>

                    <td><label for="">Upload<br> Photo</label></td>
                    <td><input type="file"></td>
                    <td><label for="">Upload<br> Signature</label></td>
                    <td><input type="file"></td>
                </tr>
            </table>
        </fieldset>
        <br>
        <center><input type="button" value="Submit" id="">
            <input type="button" value="Back">
        </center>
    </form>
</body>

</html>
