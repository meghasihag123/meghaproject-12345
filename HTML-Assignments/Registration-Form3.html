<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration-Form3</title>
</head>

<body leftmargin="80">
    <center>
        <font size="3"><b>REGISTRATION APPLICATION FORM FOR COURSE - O LEVEL</b></font>
    </center>
    <br>
    <form action="">
        <table border="1" width="100%" cellspacing="0px" cellpadding="5px">
            <tr bgcolor="#0090b8">
                <td colspan="3">
                    <font color="white"><label for=""><b>1. Registration Form</b></label></font>
                </td>
            </tr>
            <tr>
                <td><label for="">1.0</label></td>
                <td><label for="">Have you got online reference<br> number for enrolment with<br>
                        NIELIT/Accreditation/Extension<br> Center</label></td>
                <td>
                    <label for="t1">No</label>
                    <input type="radio" id="t1" name="enroll">
                    <label for="t2">Yes</label>
                    <input type="radio" id="t2" name="enroll">
                </td>
            </tr>
            <tr>
                <td><label for="">1.1</label></td>
                <td><label for="">Registration sought for</label></td>
                <td>
                    <select disabled>
                        <option value="">O LEVEL</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="">1.2</label></td>
                <td><label for="">Applied As</label></td>
                <td>
                    <label for="t3">Direct Candidate</label>
                    <input type="radio" id="t3" name="type">
                    <label for="t4">Through Institute</label><br>
                    <input type="radio" id="t4" name="type">
                </td>
            </tr>
            <tr>
                <td><label for="">1.3</label></td>
                <td><label for="">Exam Cycle</label></td>
                <td>
                    <input type="text" value="July,2022" readonly />
                </td>
            </tr>
            <tr>
                <td><label for="">1.4</label></td>
                <td><label for="">Registration Fee Will Be Paid By?</label></td>
                <td>
                    <input type="text" placeholder="Candidate Direct to NIELIT" disabled />
                </td>
            </tr>
            <tr bgcolor="#0090b8">
                <td colspan="3">
                    <font color="white"><label for=""><b>2. Applicant's Personal Details</b></label></font>
                </td>
            </tr>
            <tr>
                <td><label for="">2.1</label></td>
                <td><label for="">Applicant's full name</label></td>
                <td>
                    <select name=" " id="">
                        <option value="">--Select--</option>
                        <option value="">Mr.</option>
                        <option value="">Ms.</option>
                        <option value="">Others</option>
                    </select><br>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <td><label for="">2.2</label></td>
                <td><label for="">Care Of</label></td>
                <td>
                    <label for="t5">Parents</label>
                    <input type="radio" id="t5" name="care">
                    <label for="t6">Guardian</label>
                    <input type="radio" id="t6" name="care">
                </td>
            </tr>
            <tr>
                <td><label for="">2.2.1</label></td>
                <td><label for="">Father's Name</label></td>
                <td>
                    <select disabled>
                        <option value="">Mr.</option>
                    </select>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <td><label for="">2.2.2</label></td>
                <td><label for="">Mother's Name</label></td>
                <td>
                    <select disabled>
                        <option value="">Mrs.</option>
                    </select>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <td><label for="">2.3</label></td>
                <td><label for="">Gender</label></td>
                <td>
                    <label for="m">Male</label>
                    <input type="radio" id="m" name="Gender">
                    <label for="f">Female</label>
                    <input type="radio" id="f" name="Gender">
                    <label for="o">Others</label>
                    <input type="radio" id="o" name="Gender">
                </td>
            </tr>
            <tr>
                <td><label for="">2.4</label></td>
                <td><label for="">Date of Birth</label></td>
                <td>
                    <input type="date" id="m" name="value">
                </td>
            </tr>
            <tr>
                <td><label for="">2.5</label></td>
                <td><label for="">Marital Status</label></td>
                <td>
                    <select name="" id="">
                        <option value="">--Select--</option>
                        <option value="">Single</option>
                        <option value="">Married</option>
                        <option value="">Divorced</option>
                        <option value="">Widowed</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="">2.6</label></td>
                <td><label for="">Category</label></td>
                <td>
                    <select name="" id="">
                        <option value="">--Select--</option>
                        <option value="">General</option>
                        <option value="">OBC</option>
                        <option value="">SC</option>
                        <option value="">ST</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="">2.7</label></td>
                <td><label for="">Handicapped</label></td>
                <td>
                    <label for="t7">No</label>
                    <input type="radio" id="t7" name="Handicapped">
                    <label for="t8">Yes</label>
                    <input type="radio" id="t8" name="Handicapped">
                </td>
            </tr>
            <tr>
                <td><label for="">2.8</label></td>
                <td><label for="">Ex-Serviceman</label></td>
                <td>
                    <label for="t9">No</label>
                    <input type="radio" id="t9" name="Ex-Serviceman">
                    <label for="t10">Yes</label>
                    <input type="radio" id="t10" name="Ex-Serviceman">
                </td>
            </tr>
            <tr>
                <td><label for="">2.9</label></td>
                <td><label for=""> EWS</label></td>
                <td>
                    <label for="t11">No</label>
                    <input type="radio" id="t11" name="EWS">
                    <label for="t12">Yes</label>
                    <input type="radio" id="t12" name="EWS">
                </td>
            </tr>
            <tr>
                <td><label for="">2.10</label></td>
                <td><label for="">Religion </label></td>
                <td>
                    <select name="" id="">
                        <option value="">--Select</option>
                        <option value="">Hindu</option>
                        <option value="">Muslim</option>
                        <option value="">Jain</option>
                        <option value="">Christianity</option>
                    </select>
                </td>
            </tr>


            <tr bgcolor="#0090b8">
                <td colspan="3"><label for="">3. Contact Details </label></td>
            </tr>
            <tr>
                <td><label for="">3.1 </label></td>
                <td><label for=""> Mobile Number</label></td>
                <td>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <td><label for="">3.2 </label></td>
                <td><label for="">Email ID</label></td>
                <td>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <td><label for="">3.3 </label></td>
                <td><label for="">Address Line 1</label></td>
                <td>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <td><label for="">3.4 </label></td>
                <td><label for="">Address Line 2</label></td>
                <td>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <td><label for="">3.5 </label></td>
                <td><label for="">City</label></td>
                <td>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <td><label for="">3.6 </label></td>
                <td><label for="">State</label></td>
                <td>
                    <select name="" id="">
                        <option value="">--Select--</option>
                        <option value="">Hisar </option>
                        <option value="">Haryana</option>
                        <option value="">Delhi</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="">3.7 </label></td>
                <td><label for="">Pin Code</label></td>
                <td>
                    <input type="text">
                </td>
            </tr>

            <tr bgcolor="#0090b8">
                <td colspan="3"><label for="">4. Educational / Qualification Details </label></td>
            </tr>
            <tr>
                <td><label for="">4.1</label></td>
                <td><label for="">Highest Educational Qualification</label></td>
                <td>
                    <select name="" id="">
                        <option value="">--Select--</option>
                        <option value="">10th </option>
                        <option value="">12th</option>

                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="">4.2</label></td>
                <td><label for="">Year of Passing</label></td>
                <td>
                    <input type="text">
                </td>
            </tr>
            <tr bgcolor="#0090b8">
                <td colspan="3"><label for="">5. Identification Details </label></td>
            </tr>
            <tr>
                <td><label for=""> 5.1</label></td>
                <td><label for="">Aadhar Card Number</label></td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td><label for=""> 5.2</label></td>
                <td><label for="">Upload Photo</label></td>
                <td><input type="file"></td>
            </tr>
            <tr>
                <td colspan="3" align="center">
                    <input type="button" value="Submit">
                    <input type="button" value="Back">
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
