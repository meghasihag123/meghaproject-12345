<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive-Video</title>
    <link rel="icon" type="image/png" href="/Emojis/video-image.png">
</head>
<style>
    /* <!-- BASIC -->
    video {
        display: block;
        margin: 40px auto;
        width: 640px;
        height: 360px;
        border: 4px solid #00bcd4;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        background-color: #000;
        object-fit: cover;
    } */

    /* CUSTOM VIDEO PLAYER */
    /* Base styles (default for large screens) */
    .video-container {
        text-align: center;
        margin: 40px auto;
        background: #f0f8ff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        width: 700px;
        /* desktop default */
    }

    video {
        border: 3px solid #00bcd4;
        border-radius: 10px;
        margin-bottom: 15px;
        width: 100%;
        /* flexible width */
        height: auto;
        /* keep aspect ratio */
    }

    .controls button {
        background-color: #4CAF50;
        color: white;
        border: none;
        padding: 10px 16px;
        margin: 5px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        transition: background-color 0.3s ease;
    }

    /* Unique colors */
    .controls button:nth-of-type(1) {
        background-color: #2196F3;
    }

    /* Play */
    .controls button:nth-of-type(2) {
        background-color: #f44336;
    }

    /* Pause */
    .controls button:nth-of-type(3) {
        background-color: #FF9800;
    }

    /* Volume + */
    .controls button:nth-of-type(4) {
        background-color: #9C27B0;
    }

    /* Volume - */

    .controls button:hover {
        opacity: 0.85;
    }

    /* 📱 Small phones (max 374px) */
    @media (max-width: 374px) {
        .video-container {
            width: 95%;
            padding: 10px;
        }

        .controls button {
            font-size: 12px;
            padding: 6px 10px;
        }
    }

    /*  Medium phones (375px–480px) */
    @media (min-width: 375px) and (max-width: 480px) {
        .video-container {
            width: 90%;
            padding: 12px;
        }

        .controls button {
            font-size: 13px;
            padding: 8px 12px;
        }
    }

    /*  Tablets (481px–768px) */
    @media (min-width: 481px) and (max-width: 768px) {
        .video-container {
            width: 95%;
            max-width: 600px;
        }

        .controls button {
            font-size: 14px;
            padding: 9px 14px;
        }
    }

    /*  Laptops (769px–1024px) */
    @media (min-width: 769px) and (max-width: 1024px) {
        .video-container {
            width: 90%;
            max-width: 700px;
        }

        .controls button {
            font-size: 15px;
            padding: 10px 16px;
        }
    }

    /*  Desktops (1025px+) */
    @media (min-width: 1025px) {
        .video-container {
            width: 700px;
        }

        .controls button {
            font-size: 16px;
            padding: 12px 18px;
        }
    }
</style>

<body>
    <!-- BASIC -->
    <!-- <video controls>
        <source src="/Emojis/Video-1.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video> -->
    <!-- CUSTOM VIDEO PLAYER -->
    <div class="container">
        <video id="myVideo" controls>
            <source src="/Emojis/Video-1.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <div class="controls">
            <button onclick="document.getElementById('myVideo').play()">Play</button>
            <button onclick="document.getElementById('myVideo').pause()">Pause</button>
            <button onclick="document.getElementById('myVideo').volume +=0.1">Volume +</button>
            <button onclick="document.getElementById('myVideo').volume -=0.1">Volume -</button>
        </div>
    </div>

</body>

</html>
