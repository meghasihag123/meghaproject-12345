<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGNUP FORM</title>
    <link rel="stylesheet" href="Sign-up-Form.css">
</head>

<body>
    <form action="">
        <table align="center" bgcolor="pink">
            <tr>
                <th>
                    <font size="5px">Sign Up</font>
                </th>
            </tr>
            <tr>
                <td><label for="">Username</label></td>
            </tr>
            <tr>
                <td class="dropdown">
                    <input type="text" placeholder="Enter your username" style="width: 510px;">
                    <div class="dropdown-content">Please fill out this field</div>
                </td>
            </tr>
            <tr>
                <td><label for="">Email</label></td>
            </tr>
            <tr>
                <td>
                    <input type="text" placeholder="Enter your email">
                </td>
            </tr>
            <tr>
                <td><label for="">Password</label></td>
            </tr>
            <tr>
                <td>
                    <input type="password" placeholder="Enter your password">
                </td>
            </tr>
            <tr>
                <td><label for="">Confirm Password</label></td>
            </tr>
            <tr>
                <td>
                    <input type="password" placeholder="Re-enter your password">
                </td>
            </tr>
            <tr>
                <td style="background: skyblue;text-align:center;color:white;border-radius:5px">
                    <label for="">Sign Up</label>
                </td>
            </tr>
            <tr>
                <td style="text-align: center;">
                    <font size="3px">Already have an account?</font>
                    <a href="#"><u>Log In</u></a>
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
