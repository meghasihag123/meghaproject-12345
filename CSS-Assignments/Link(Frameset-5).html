<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link(Frameset-5)</title>
</head>
<style>
  .video-link a {
    font-size: 28px;        /* Bigger font size */
    color: dodgerblue;      /* Link color */
    font-weight: bold;      /* Bold text */
    text-decoration: none;  /* Removes underline */
    padding: 10px 20px;     /* Adds spacing around text */
    border: 2px solid dodgerblue; /* Border around link */
    border-radius: 8px;     /* Rounded corners */
    display: inline-block;  /* Makes padding & border work nicely */
    transition: 0.3s ease;  /* Smooth hover effect */
    margin-left: 40px;
    margin-top: 200px;
  }

  .video-link a:hover {
    background-color: dodgerblue; /* Fill background on hover */
    color: white;                 /* Change text color */
    transform: scale(1.1);        /* Slight zoom effect */
  }
</style>
<body>
    <div  class="video-link">
        <a href="Video-Link(Frameset-5).html" target="thumbnail"
   
    >Video</a>
    </div>
    
</body>
</html>
