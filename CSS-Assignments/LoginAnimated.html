<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Animated</title>
    <link rel="stylesheet" href="LoginAnimated.css">
</head>

<body>
   <div class="login-box">
        <!-- Animated borders -->
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        
        <form action="#">
            <h2>Login</h2>
            
            <div class="input-group">
                <input type="email" required>
                <label>Email</label>
            </div>
            
            <div class="input-group">
                <input type="password" required>
                <label>Password</label>
            </div>
            
            <div class="form-links">
                <a href="#">Forgot Password?</a>
                <a href="#">Sign Up</a>
            </div>
            
            <button type="submit" class="submit-btn">Sign In</button>
        </form>
    </div>
</body>

</html>

<!-- 
FULL-FORM
rel → “relationship” 
Defines the relationship between 
the current HTML document and the linked resource.
href → “hypertext reference”
Specifies the path or URL to the resource being linked.
-->
