<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thumbnail-Link</title>
</head>
<style>
     .image embed {
    width: 60%;        /* Adjust between 50%–70% */
    height: auto;      /* Keeps aspect ratio */
    border: 4px solid #652828;
    border-radius: 8px;
    display: block;    /* Makes it behave like a block element */
    margin:10px auto;    /* Centers it horizontally */
  }
</style>
<body>
    <div class="image">
        <a href="Emojis/Video-1.mp4" 
        target="video">
        <embed src="thumbnail-2.jpg" target="thumbnail" type="">
        </a>
        <p style="text-align: center;">CLICK The IMAGE</p>
    </div>
</body>

</html>
