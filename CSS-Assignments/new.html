<!DOCTYPE html>
<html>

<head>
    <title>Navigation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        a {
            text-decoration: none;
            display: inline-block;
            margin: 20px 0;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 28px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        /* Unique colors for each link */
        .flower {
            color: white;
            background: dodgerblue;
        }

        .bougainvillea {
            color: white;
            background: magenta;
        }

        .drone {
            color: white;
            background: orange;
        }

        /* Hover effects */
        a:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.3);
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <!-- Links -->
    <a href="/Emojis/favourite.jpg" target="a">
        <span class="link-text flower">Flower</span>
    </a><br><br>
    <a href="butterfly_-_removebg-preview.png" target="a">
        <span class="link-text flower">Butterfly</span>
    </a><br><br>

    <a href="video.mp4" target="a">
        <span class="link-text flower">Flower petals</span>
    </a><br><br>

    <a href="video1.mp4" target="b">
        <span class="link-text bougainvillea">Bougainvillea</span>
    </a><br><br>

    <a href="video2.mp4" target="b">
        <span class="link-text drone">Drone view</span>
    </a><br><br>
    <a href="/Emojis/greenery.jpg" target="a">
        <span class="link-text drone">Greenery</span>
    </a><br><br>
    <a href="/Emojis/rabbit.jpg" target="b">
        <span class="link-text drone">Rabbit</span>
    </a>
</body>

</html>
