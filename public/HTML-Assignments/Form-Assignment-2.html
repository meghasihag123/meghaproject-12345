<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form-assignment2</title>
</head>

<body>
    <form>
        <table align="center" width="70%" cellpadding="10px" cellspacing="0">
            <tr>
                <td rowspan="10"> <img src="doc.webp" align="left" width="500px" alt="Doctor Appointment Form"></td>
                <td colspan="3">
                    <center>
                        <font size="6px"><b>Doctor Appointment Form</b></font>
                    </center>
                    <br>
                    <hr color="red">
                </td>
            </tr>
            <tr>
                <td>Appointment<br> Date </td>
                <td colspan="2"><input type="date"></td>
            </tr>
            <tr>
                <td>Appointment<br> Time </td>
                <td colspan="2"><input type="time"></td>
            </tr>
            <tr>
                <td>Name </td>
                <td colspan=""><input type="text" placeholder="First"></td>
                <td colspan="2"><input type="text" placeholder="Last"></td>
            </tr>
            <tr>
                <td>Gender </td>
                <td colspan="2"><label for="">Male</label>
                    <input type="radio" name="Gender">
                    <label for="">Female</label>
                    <input type="radio" name="Gender">
                </td>
            </tr>
            <tr>
                <td><label for="">Phone</label></td>
                <td colspan="2"><input type="text " placeholder="####"></td>
            </tr>
            <tr>
                <td><label for="">Address</label></td>
                <td><input type="text" placeholder="city"></td>
                <td><input type="text " placeholder="state"></td>
            </tr>
            <br><br>
            <tr>
                <td><label for="">Your Query</label></td>
                <td colspan="2"><textarea rows="4" cols="40"></textarea></td>
            </tr>
            <tr>
                <td valign="top"><label for="">Appointment<br>Type</label></td>
                <td colspan="2">Select which appointment type(s) you require<br>
                    <input type="checkbox" name="" id="">
                    <label for="">Cervix checkup</label><br>
                    <input type="checkbox" name="" id="">
                    <label for="">Heart checkup</label><br>
                    <input type="checkbox" name="" id="">
                    <label for="">Eye check-up</label><br>
                    <input type="checkbox" name="" id="">
                    <label for="">Hearing Test </label>
                </td>
            </tr>
            <tr>
                <td colspan="2"><input type="button" value="send" id=""></td>
            </tr>

        </table>
    </form>
</body>

</html>
