<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration-Form2</title>
</head>

<body>
    <form action="">
        <table border="1" align="center" cellpadding="5px" width="60%">
            <tr>
                <th colspan="4">
                    <h1>Registration Form</h1>
                </th>
            </tr>
            <tr>
                <td><label for="">Student<br> Name</label></td>
                <td>
                    <input type="text" placeholder="First Name">
                </td>
                <td>
                    <input type="text " placeholder="Middle Name">
                </td>
                <td>
                    <input type="text " placeholder="Last Name">
                </td>
            </tr>
            <tr>
                <td><label for="">Father's <br>Name</label></td>
                <td>
                    <input type="text" placeholder="Enter your father's Name">
                </td>
                <td><label for="">Mother's Name</label></td>
                <td>
                    <input type="text" placeholder="Enter your Mother's Name">
                </td>
            </tr>
            <tr>
                <td><label for="">Date of<br> Birth</label></td>
                <td>
                    <input type="date">
                </td>
                <td><label for="">Gender</label></td>
                <td><label for="m">Male</label>
                    <input type="radio" id="m" name="gender">
                    <label for="f">Female</label>
                    <input type="radio" id="f" name="gender">
                </td>
            </tr>
            <tr>
                <td><label for="">Category</label></td>
                <td>
                    <label for="g">Gen</label>
                    <input type="radio" id="g" name="Category">
                    <label for="obc">OBC</label>
                    <input type="radio" id="obc" name="Category">
                    <label for="sc/st">SC/ST</label>
                    <input type="radio" id="sc/st" name="Category">
                </td>
                <td><label for="">Handicapped</label></td>
                <td>
                    <label for="y">Yes</label>
                    <input type="radio" id="y" name="value">
                    <label for="no">No</label>
                    <input type="radio" id="no" name="value">
                </td>
            </tr>
            <tr>
                <td><label for="">Ex-<br>Serviceman</label>
                </td>
                <td>
                    <label for="yes">Yes</label>
                    <input type="radio" id="yes" name="ser">
                    <label for="n">No</label>
                    <input type="radio" id="n" name="ser">
                </td>
                <td><label for="">EWS</label></td>
                <td>
                    <label for="sey">Yes</label>
                    <input type="radio" id="sey" name="say">
                    <label for="say">No</label>
                    <input type="radio" id="say" name="say">
                </td>
            <tr>
                <td><label for="">Email ID</label></td>
                <td>
                    <input type="text" value=" ">
                </td>
                <td><label for="">Mobile No.</label>
                </td>
                <td>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <td>State</td>
                <td>
                    <select name="" id="">Select any one
                        <option value="">select any one</option>
                        <option value="">Uttar Pradesh</option>
                        <option value="">Madhya Pradesh</option>
                    </select>
                </td>
                <td>City</td>
                <td>
                    <select name="" id="">
                        <option value="">select any one</option>
                        <option value="">Prayagraj</option>
                        <option value="">Kanpur</option>
                        <option value="">Bhopal</option>
                    </select>
                </td>
            <tr>
                <td><label for="">Upload<br> Photo</label></td>
                <td>
                    <input type="file" value="Choose File">

                </td>
                <td><label for="">Upload Signature</label></td>
                <td>
                    <input type="file" value="Choose File">

                </td>
            </tr>

            <tr>
                <td></td>
                <td colspan="3">
                    <center><input type="button" value="Submit"> </center>
                </td>
            </tr>

        </table>
    </form>

</body>

</html>
